<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/normalize.css">
</head>

<body>
  <section>

    <!-- Need a form with multiple choice questions that you can get 3 different values from(numbers 1 - 3)-->
      <h1>Wutang Name Runner</h1>
      <p>What is your favorite color?</p>
      <label>
        <input type="radio" name="q1" value="a"> Green
      </label>
      <label>
        <input type="radio" name="q1" value="b"> Blue
      </label>
      <label>
        <input type="radio" name="q1" value="c"> Red
      </label>

      <p>What activity do you like to do most of this list?</p>
      <label>
        <input type="radio" name="q2" value="a"> Sleep
      </label>
      <label>
        <input type="radio" name="q2" value="b"> Exercise
      </label>
      <label>
        <input type="radio" name="q2" value="c"> Watch a Movie
      </label>

      <p>What meal did you last eat?</p>
      <label>
        <input type="radio" name="q3" value="a"> Breakfast
      </label>
      <label>
        <input type="radio" name="q3" value="b"> Lunch
      </label>
      <label>
        <input type="radio" name="q3" value="c"> Dinner
      </label>

      <p>What animal do you like best?</p>
      <label>
        <input type="radio" name="q4" value="a"> Bird
      </label>
      <label>
        <input type="radio" name="q4" value="b"> Whale
      </label>
      <label>
        <input type="radio" name="q4" value="c"> Tortoise
      </label>

      <p>What was the most recent emotion you experienced?</p>
      <label>
        <input type="radio" name="q5" value="a"> Anger
      </label>
      <label>
        <input type="radio" name="q5" value="b"> Love
      </label>
      <label>
        <input type="radio" name="q5" value="c"> Happy
      </label>

      <button id="submit" type="submit">Submit</button>

    <h2 id="nameFromBackend"></h2>
  </section>
  <script type="text/javascript" src="/js/main.js"></script>
</body>

</html>
